name: Move hero above fold

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/move-hero-above-fold.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Move hero visual before copy
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/index.html')
          s = p.read_text(encoding='utf-8')
          block = '''    <figure class="hero-visual">\n      <img\n        src="assets/jucho-kun-hero.webp"\n        alt="jucho-kunの利用イメージ。物件情報の入力からAIによる一次調査、Excel調査報告書の出力までの流れ"\n        width="600"\n        height="400"\n        loading="eager"\n        fetchpriority="high">\n      <figcaption>物件情報 → AI一次調査 → 調査報告書.xlsx</figcaption>\n    </figure>\n\n'''
          if block not in s:
              raise SystemExit('hero block not found')
          s = s.replace(block, '', 1)
          anchor = '    <span class="hero-eyebrow">jucho-kun / 重調くん</span>\n'
          if anchor not in s:
              raise SystemExit('hero anchor not found')
          s = s.replace(anchor, block + anchor, 1)
          s = s.replace('  padding: 100px 0 80px;', '  padding: 48px 0 80px;', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/index.html
          git diff --cached --quiet || git commit -m "fix: show hero image above the fold"
          git push origin HEAD:main
